name: Bug report for Seventwos Workspace for iOS
description: Report an issue with Seventwos Workspace for iOS. Please [check open issues](https://github.com/seventwos-app/usr-workspace-ios/issues) first, in case it has already been reported.
labels: [T-Defect]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

        Please report security issues by email to security@matrix.org
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to reproduce
      description: Please attach screenshots, videos or logs if you can.
      placeholder: Tell us what you see!
      value: |
        1. Where are you starting? What can you see?
        2. What do you click?
        3. More steps…
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Outcome
      placeholder: Tell us what went wrong
      value: |
        #### What did you expect?

        #### What happened instead?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Your phone model
      placeholder: e.g. iPhone 16
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: Operating system version
      placeholder: e.g. iOS18.1.1, under "software version"
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Application version
      description: You can find the version information in the Seventwos Workspace settings.
      placeholder: |
        e.g. Version: 1.1.1 (48)
    validations:
      required: false
  - type: input
    id: homeserver
    attributes:
      label: Homeserver
      description: |
        Which server is your account registered on? If it is a local or non-public homeserver, please tell us what is the homeserver implementation (ex: Synapse/Dendrite/etc.) and the version.
      placeholder: e.g. matrix.org or Synapse 1.121.1rc1
    validations:
      required: false
  - type: dropdown
    id: rageshake
    attributes:
      label: Will you send logs?
      description:  |
        You can submit logs for this issue from the login screen or the application settings by chosing `Report a problem`. Describe the issue, mentioning that you have also filed a bug (it's helpful if you can include a link to the bug). Send the report to submit anonymous logs to the developers.
      options:
        - 'Yes'
        - 'No'
    validations:
      required: true
